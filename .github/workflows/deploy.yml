# Deploys main to the agent-comic Worker. Replaces Workers Builds, which stopped
# firing on merges on 2026-11-10.
#
# Why workflow_run as well as push: the merge gate merges with GITHUB_TOKEN, and
# GitHub doesn't start push workflows for pushes made with that token. So gate
# merges arrive through workflow_run, and Michael's own merges arrive through push.
# workflow_run always runs this file from main, so a PR can't change what deploys.
name: deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [merge-gate]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
